version: 2

models:
  - name: stg_orders

    columns:

      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: order_amount
        tests:
          - not_null

      - name: order_status
        tests:
          - accepted_values:
             arguments:
              values:
               - PENDING
               - SHIPPED
               - CANCELLED
               - DELIVERED

      - name: order_created_at
        tests:
          - not_null

      